plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'gg.jte.gradle' version '3.1.16'
    id 'nu.studer.jooq' version '9.0'
}

group = 'xyz.goraebap'
version = '0.0.1-SNAPSHOT'
description = 'dev-goraebap-blog'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'

    // TOTP (Google Authenticator)
    implementation 'dev.samstevens.totp:totp:1.7.1'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'

    // AWS S3 SDK (for Cloudflare R2)
    implementation 'software.amazon.awssdk:s3:2.29.51'

    // Google Cloud Vision
    implementation 'com.google.cloud:google-cloud-vision:3.55.0'

    // RSS Parser (ROME)
    implementation 'com.rometools:rome:2.1.0'

    // Firebase Admin SDK
    implementation 'com.google.firebase:firebase-admin:9.4.3'

    // JTE
    implementation 'gg.jte:jte:3.1.16'
    implementation 'gg.jte:jte-spring-boot-starter-3:3.1.16'

    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // JOOQ - 타입 안전한 SQL 쿼리 빌더
    // spring-boot-starter-jooq: DSLContext 빈 자동 설정, 런타임에 사용
    // jooqGenerator: 코드 생성 시 DB 연결용 드라이버 (generateJooq 태스크에서만 사용)
    implementation 'org.springframework.boot:spring-boot-starter-jooq'
    jooqGenerator 'org.postgresql:postgresql'
}

tasks.named('test') {
    useJUnitPlatform()
}

// 개발 시 소스 폴더에서 직접 리소스 읽기
bootRun {
    sourceResources sourceSets.main
}

// JTE 설정
jte {
    sourceDirectory = file("src/main/frontend/views").toPath()
    generate()
}

// 컴파일 전에 JTE 템플릿 생성
tasks.named('compileJava') {
    dependsOn 'generateJte'
}

// ============================================================================
// JOOQ 코드 생성 설정
// ============================================================================
// JOOQ는 DB 스키마를 기반으로 타입 안전한 Java 클래스를 생성합니다.
//
// 생성 명령어:
//   ./gradlew generateJooq                    (기본: local 프로필)
//   ./gradlew generateJooq -PjooqProfile=prod (운영 DB 사용 시)
//
// 생성 위치: src/generated/jooq/
//   - Tables.java: 테이블 상수 (POSTS, SERIES 등)
//   - tables/*.java: 테이블 메타데이터 클래스
//   - tables/records/*.java: 행(row) 매핑 클래스
//
// 사용 예시:
//   import static jooq.Tables.*;
//   dsl.select(POSTS.TITLE).from(POSTS).where(POSTS.ID.eq(1L)).fetch();
// ============================================================================

// JOOQ 생성 코드를 컴파일 대상에 포함
sourceSets {
    main {
        java {
            srcDir 'src/generated'
        }
    }
}

// application-{profile}.properties에서 DB 접속 정보 로드
// -PjooqProfile=prod 옵션으로 프로필 변경 가능 (기본값: local)
// Docker 빌드 시에는 파일이 없을 수 있음 (JOOQ 코드는 이미 생성되어 있음)
def jooqProfile = project.hasProperty('jooqProfile') ? project.property('jooqProfile') : 'local'
def jooqProps = new Properties()
def jooqPropsFile = file("src/main/resources/application-${jooqProfile}.properties")
if (jooqPropsFile.exists()) {
    jooqPropsFile.withInputStream { jooqProps.load(it) }
}

jooq {
    // Spring Boot가 관리하는 JOOQ 버전 사용 (버전 충돌 방지)
    version = dependencyManagement.importedProperties['jooq.version']

    configurations {
        main {
            // false: 빌드 시 자동 생성 안 함, 명시적으로 generateJooq 실행 필요
            generateSchemaSourceOnCompilation = false

            generationTool {
                logging = org.jooq.meta.jaxb.Logging.WARN

                // DB 접속 정보 (application-{profile}.properties에서 로드)
                jdbc {
                    driver = jooqProps.getProperty('spring.datasource.driver-class-name')
                    url = jooqProps.getProperty('spring.datasource.url')
                    user = jooqProps.getProperty('spring.datasource.username')
                    password = jooqProps.getProperty('spring.datasource.password')
                }

                generator {
                    name = 'org.jooq.codegen.DefaultGenerator'

                    database {
                        name = 'org.jooq.meta.postgres.PostgresDatabase'
                        inputSchema = 'public'
                    }

                    generate {
                        records = true           // Record 클래스 생성 (PostsRecord 등)
                        immutablePojos = false   // 변경 가능한 POJO
                        fluentSetters = true     // setter 체이닝 지원
                        javaTimeTypes = true     // java.time 패키지 사용 (LocalDateTime 등)
                    }

                    target {
                        packageName = 'jooq'         // 생성될 패키지명
                        directory = 'src/generated' // 생성 디렉토리 (src/main/java와 분리)
                    }
                }
            }
        }
    }
}
