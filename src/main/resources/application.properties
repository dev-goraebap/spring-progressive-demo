spring.application.name=dev-goraebap-blog

# Active Profile (local for development, prod for production)
spring.profiles.active=local

# Enable hidden method filter for PUT/DELETE from forms
spring.mvc.hiddenmethod.filter.enabled=true

# JPA Common Settings
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger / OpenAPI Settings
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# MyBatis Settings
mybatis.mapper-locations=classpath:mappers/**/*.xml
mybatis.type-aliases-package=xyz.goraebap.blog
mybatis.configuration.map-underscore-to-camel-case=true

# Logging Settings
logging.level.root=INFO
logging.level.xyz.goraebap.blog=INFO

# MyBatis SQL Logging
logging.level.xyz.goraebap.blog.app.todo.TodoQueryMapper=DEBUG

# Hibernate SQL Logging (JPA)
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Spring Framework Logging
logging.level.org.springframework.web=INFO

# Logging Pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Database settings are in profile-specific files:
# - application-local.properties (local development)
# - application-prod.properties (production)

# JWT Settings
# jwt.secret is in profile-specific files (application-local.properties, application-prod.properties)
jwt.access-token-expiry=21600000