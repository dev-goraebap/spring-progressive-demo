<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="htmx-config" content='{"globalViewTransitions": true}'>
    <title>Demo</title>

    <!-- 개발 환경: Vite dev server -->
    <th:block th:if="${@environment.acceptsProfiles('local')}">
        <link rel="stylesheet" href="http://localhost:5173/src/style.css">
        <script type="module" src="http://localhost:5173/@vite/client"></script>
        <script type="module" src="http://localhost:5173/src/app.js"></script>
    </th:block>

    <!-- 프로덕션: 빌드된 파일 -->
    <th:block th:unless="${@environment.acceptsProfiles('local')}">
        <link rel="stylesheet" th:href="@{/builds/app.css}">
        <script type="module" th:src="@{/builds/app.js}"></script>
    </th:block>
</head>
<body hx-boost="true">
<div id="htmx-progress"></div>
<div th:replace="~{fragments/header :: header}"></div>

<main layout:fragment="content"></main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
